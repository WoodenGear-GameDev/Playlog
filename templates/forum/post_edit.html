{% extends 'base.html' %}

{% block title %}Редактирование сообщения | Playlog{% endblock %}

{% block content %}
<h1>Редактирование сообщения</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a href="{% url 'post_permalink' post.pk %}">Отмена</a>
</form>
{% endblock %}
