{% extends 'base.html' %}

{% block title %}Новая тема | Playlog{% endblock %}

{% block content %}
<h1>Новая тема: {{ game }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Создать тему</button>
    <a href="{% url 'topic_list' game.pk %}">Отмена</a>
</form>
{% endblock %}
