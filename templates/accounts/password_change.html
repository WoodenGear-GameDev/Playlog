{% extends 'base.html' %}

{% block title %}Смена пароля | Playlog{% endblock %}

{% block content %}
<h1>Смена пароля</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сменить пароль</button>
    <a href="{% url 'profile' %}">Отмена</a>
</form>
<p><a href="{% url 'password_reset' %}">Не помните текущий пароль?</a></p>
{% endblock %}
