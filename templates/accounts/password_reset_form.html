{% extends 'base.html' %}

{% block title %}Восстановление пароля | Playlog{% endblock %}

{% block content %}
<h1>Восстановление пароля</h1>
<p>Укажите почту, с которой вы регистрировались: мы отправим ссылку для создания нового пароля.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Отправить ссылку</button>
</form>
<p><a href="{% url 'login' %}">Вернуться ко входу</a></p>
{% endblock %}
