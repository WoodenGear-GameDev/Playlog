{% extends 'base.html' %}

{% block title %}Новый пароль | Playlog{% endblock %}

{% block content %}
{% if validlink %}
<h1>Новый пароль</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить пароль</button>
</form>
{% else %}
<h1>Ссылка недействительна</h1>
<p>Она устарела или уже была использована.</p>
<p><a href="{% url 'password_reset' %}">Запросить новую ссылку</a></p>
{% endif %}
{% endblock %}
