{% extends 'base.html' %}

{% block title %}Ссылка недействительна // PLAYLOG{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-4 sm:my-10">
    <div class="border border-paper-300 dark:border-carbon-800 bg-paper-100 dark:bg-carbon-900">

        <!-- Шапка -->
        <div class="px-6 py-4 border-b border-paper-300 dark:border-carbon-800 bg-paper-50 dark:bg-carbon-950/60 flex items-center justify-between">
            <div>
                <p class="font-mono text-[10px] uppercase tracking-widest text-red-600 dark:text-red-400">
                    [AUTH // TOKEN_EXPIRED]
                </p>
                <h1 class="text-xl font-bold font-mono uppercase tracking-tight text-zinc-950 dark:text-white mt-0.5">
                    Ссылка недействительна
                </h1>
            </div>
            <span class="px-2 py-0.5 font-mono text-[10px] font-bold bg-red-500 text-white">
                ERR
            </span>
        </div>

        <!-- Сообщение и кнопка повторной отправки -->
        <div class="p-6 space-y-5">
            <p class="font-mono text-xs sm:text-sm text-zinc-700 dark:text-zinc-300 leading-relaxed">
                Она устарела или уже была использована.
            </p>

            <a href="{% url 'resend_confirmation' %}"
               class="block w-full text-center py-2.5 px-4 text-xs font-mono font-bold uppercase tracking-wider bg-signal-500 hover:bg-signal-400 text-carbon-950 border border-signal-500 transition-colors">
                ОТПРАВИТЬ ПИСЬМО ПОВТОРНО →
            </a>
        </div>

    </div>
</div>
{% endblock %}
