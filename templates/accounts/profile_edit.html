{% extends 'base.html' %}

{% block title %}Редактирование профиля | Playlog{% endblock %}

{% block content %}
<h1>Редактирование профиля</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ username_form.as_p }}
    {{ avatar_form.as_p }}
    <button type="submit">Сохранить</button>
    <a href="{% url 'profile' %}">Отмена</a>
</form>
{% endblock %}
